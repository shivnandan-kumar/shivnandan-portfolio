services:
  # The plan is intentionally omitted; choose a paid plan only if you approve its cost.
  # Render Free blocks outbound SMTP ports, so the contact form needs a paid plan to use Gmail SMTP.
  - type: web
    name: shivnandan-portfolio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CONTACT_RECIPIENT
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
