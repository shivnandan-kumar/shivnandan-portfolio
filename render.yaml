services:
  # The plan is intentionally omitted; choose a paid plan only if you approve its cost.
  # The browser submits contact messages directly to Web3Forms.
  - type: web
    name: shivnandan-portfolio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
